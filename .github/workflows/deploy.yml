name: Deploy server

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: bpr-conference-server-production
    cancel-in-progress: false

permissions:
    contents: read
    packages: write

env:
    IMAGE_REF: ghcr.io/${{ github.repository }}:${{ github.sha }}
    LATEST_IMAGE_REF: ghcr.io/${{ github.repository }}:latest
    CONTAINER_NAME: ${{ vars.EC2_CONTAINER_NAME || 'bpr-conference-server' }}
    CONTAINER_PORT: "3001"
    HOST_PORT: ${{ vars.EC2_HOST_PORT || '3001' }}
    BIND_ADDRESS: ${{ vars.EC2_BIND_ADDRESS || '0.0.0.0' }}
    HEALTHCHECK_PATH: ${{ vars.EC2_HEALTHCHECK_PATH || '/api/auth/status' }}
    EC2_ENV_FILE: ${{ vars.EC2_ENV_FILE || '/opt/bpr-conference-server/.env' }}
    EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run checks
              run: npm run check

    build:
        name: Build and publish image
        runs-on: ubuntu-latest
        needs: check

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.IMAGE_REF }}
                      ${{ env.LATEST_IMAGE_REF }}

    deploy:
        name: Deploy to EC2
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Prepare SSH key
              env:
                  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
              run: |
                  set -euo pipefail
                  mkdir -p ~/.ssh
                  printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/bpr-conference-deploy.pem
                  chmod 600 ~/.ssh/bpr-conference-deploy.pem

            - name: Add EC2 host key
              env:
                  EC2_HOST: ${{ secrets.EC2_HOST }}
              run: |
                  set -euo pipefail
                  ssh-keyscan -p "$EC2_SSH_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

            - name: Deploy container
              env:
                  EC2_HOST: ${{ secrets.EC2_HOST }}
                  EC2_USER: ${{ secrets.EC2_USER }}
                  GHCR_USER: ${{ github.actor }}
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  {
                      printf 'export IMAGE_REF=%q\n' "$IMAGE_REF"
                      printf 'export CONTAINER_NAME=%q\n' "$CONTAINER_NAME"
                      printf 'export CONTAINER_PORT=%q\n' "$CONTAINER_PORT"
                      printf 'export HOST_PORT=%q\n' "$HOST_PORT"
                      printf 'export BIND_ADDRESS=%q\n' "$BIND_ADDRESS"
                      printf 'export HEALTHCHECK_PATH=%q\n' "$HEALTHCHECK_PATH"
                      printf 'export ENV_FILE=%q\n' "$EC2_ENV_FILE"
                      printf 'export GHCR_USER=%q\n' "$GHCR_USER"
                      printf 'export GHCR_TOKEN=%q\n' "$GHCR_TOKEN"
                      cat scripts/deploy-ec2-docker.sh
                  } | ssh -i ~/.ssh/bpr-conference-deploy.pem \
                      -p "$EC2_SSH_PORT" \
                      "$EC2_USER@$EC2_HOST" \
                      'bash -s'
